<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mamm0n</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; font-family: Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; filter: grayscale(1); }
  header { padding: 10px 16px; border-bottom: 1px solid #fff; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
  main { flex: 1; display: flex; min-height: 0; }
  #stream { flex: 1; min-width: 0; }
  #chat { width: var(--chat-w, 340px); flex: none; }
  #handle { width: 8px; flex: none; background: #444; cursor: col-resize; touch-action: none; border-left: 1px solid #fff; }
  #handle:hover, body.dragging #handle { background: #fff; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  body.dragging { user-select: none; cursor: col-resize; }
  body.dragging iframe { pointer-events: none; }
  @media (max-width: 800px) {
    main { flex-direction: column; }
    #stream { flex: none; height: 56vw; border-bottom: 1px solid #fff; }
    #chat { flex: 1; width: 100%; }
    #handle { display: none; }
  }
</style>
</head>
<body>
  <header>mamm0n</header>
  <main>
    <div id="stream"></div>
    <div id="handle" title="Przeciągnij, żeby zmienić szerokość czatu (dwuklik = reset)"></div>
    <div id="chat"></div>
  </main>
<script>
  // Twitch wymaga parametru "parent" z domeną, na której stoi strona
  var host = location.hostname || "localhost";
  var channel = "mamm0n";
  document.getElementById("stream").innerHTML =
    '<iframe src="https://player.twitch.tv/?channel=' + channel + '&parent=' + host + '&muted=false" allowfullscreen></iframe>';
  document.getElementById("chat").innerHTML =
    '<iframe src="https://www.twitch.tv/embed/' + channel + '/chat?parent=' + host + '&darkpopout"></iframe>';

  // Zmiana szerokości czatu
  var DEFAULT_W = 340, MIN_W = 200;
  var root = document.documentElement;
  var handle = document.getElementById("handle");

  function setWidth(w) {
    var max = Math.round(window.innerWidth * 0.7);
    w = Math.max(MIN_W, Math.min(max, w));
    root.style.setProperty("--chat-w", w + "px");
    return w;
  }
  function save(w) { try { localStorage.setItem("chatW", w); } catch (e) {} }

  try {
    var saved = parseInt(localStorage.getItem("chatW"), 10);
    if (saved) setWidth(saved);
  } catch (e) {}

  var current = DEFAULT_W;
  handle.addEventListener("pointerdown", function (e) {
    handle.setPointerCapture(e.pointerId);
    document.body.classList.add("dragging");
  });
  handle.addEventListener("pointermove", function (e) {
    if (!document.body.classList.contains("dragging")) return;
    current = setWidth(window.innerWidth - e.clientX - 4);
  });
  handle.addEventListener("pointerup", function () {
    document.body.classList.remove("dragging");
    save(current);
  });
  handle.addEventListener("dblclick", function () {
    current = setWidth(DEFAULT_W);
    save(current);
  });
</script>
</body>
</html>
